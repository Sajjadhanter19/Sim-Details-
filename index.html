
<html lang="ur">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sajjad Baloch Finder</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#070b14;color:#e8f0ff;min-height:100vh}
    .wrap{max-width:900px;margin:0 auto;padding:20px 16px 40px}
    .hidden{display:none!important}
    .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .login-box{width:100%;max-width:380px;background:#0f1629;border:1px solid rgba(0,229,255,.2);border-radius:18px;padding:28px}
    .login-box h1{text-align:center;font-size:1.4rem;margin-bottom:6px}
    .login-box .sub{text-align:center;color:#8b9bb8;font-size:.85rem;margin-bottom:22px}
    .login-box label{display:block;font-size:.8rem;color:#8b9bb8;margin-bottom:6px}
    .login-box input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(0,229,255,.2);background:#0a101f;color:#fff;font-size:1rem;margin-bottom:14px;outline:none}
    .login-box button{width:100%;padding:13px;border:none;border-radius:10px;font-weight:600;font-size:1rem;cursor:pointer;background:linear-gradient(135deg,#00e5ff,#00b4d8);color:#001018}
    .login-err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:10px 12px;border-radius:8px;font-size:.85rem;margin-bottom:12px;display:none}
    header{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid rgba(0,229,255,.15);margin-bottom:22px;flex-wrap:wrap;gap:10px}
    .logo{display:flex;align-items:center;gap:12px}
    .logo-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#00e5ff,#0077ff);display:grid;place-items:center;font-weight:700;color:#000}
    .logo h1{font-size:1.15rem}
    .logo span{font-size:.72rem;color:#8b9bb8}
    .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .user-chip{font-size:.8rem;padding:5px 12px;border-radius:999px;background:rgba(0,229,255,.1);color:#00e5ff;border:1px solid rgba(0,229,255,.25)}
    .btn-sm{padding:7px 14px;border-radius:8px;border:1px solid rgba(0,229,255,.25);background:transparent;color:#8b9bb8;font-size:.8rem;cursor:pointer}
    .btn-danger{border-color:rgba(239,68,68,.4);color:#f87171}
    h2{text-align:center;font-size:1.6rem;margin-bottom:6px}
    .sub{text-align:center;color:#8b9bb8;margin-bottom:20px;font-size:.9rem}
    .card{background:#0f1629;border:1px solid rgba(0,229,255,.18);border-radius:16px;padding:18px;margin-bottom:18px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .field{flex:1;min-width:140px;padding:12px 14px;border-radius:10px;border:1px solid rgba(0,229,255,.2);background:#0a101f;color:#fff;font-size:.95rem;font-family:monospace;outline:none}
    .btn-go{padding:12px 18px;border-radius:10px;border:none;font-weight:600;background:linear-gradient(135deg,#00e5ff,#00b4d8);color:#001018;cursor:pointer}
    .btn-go:disabled{opacity:.5}
    .loading{text-align:center;padding:28px;color:#8b9bb8}
    .err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:12px 14px;border-radius:10px}
    .result{background:#0f1629;border:1px solid rgba(0,229,255,.18);border-radius:14px;overflow:hidden;margin-bottom:14px}
    .result-top{padding:14px 16px;border-bottom:1px solid rgba(0,229,255,.12);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:linear-gradient(90deg,rgba(0,229,255,.1),transparent)}
    .result-top h3{font-size:1.1rem}
    .result-body{padding:16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
    .item{background:#0a101f;border-radius:8px;padding:10px 12px;border:1px solid rgba(255,255,255,.04)}
    .item label{display:block;font-size:.65rem;color:#8b9bb8;text-transform:uppercase;margin-bottom:3px}
    .item .v{font-family:monospace;font-size:.88rem;word-break:break-all}
    .sec{font-size:.72rem;color:#00e5ff;text-transform:uppercase;margin:14px 0 8px;font-weight:600}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{background:rgba(0,229,255,.12);border:1px solid rgba(0,229,255,.25);color:#00e5ff;padding:5px 10px;border-radius:6px;font-family:monospace;font-size:.82rem}
    table{width:100%;border-collapse:collapse;font-size:.82rem}
    th{text-align:left;padding:7px;color:#8b9bb8;border-bottom:1px solid rgba(0,229,255,.15)}
    td{padding:8px 7px;border-bottom:1px solid rgba(255,255,255,.04);font-family:monospace}
    footer{margin-top:30px;text-align:center;color:#8b9bb8;font-size:.82rem;padding-top:16px;border-top:1px solid rgba(0,229,255,.12)}
    footer b{color:#00e5ff}
    @media(max-width:500px){.row{flex-direction:column}button{width:100%}}
  </style>
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h1>Sajjad Baloch Finder</h1>
      <p class="sub">Login to continue</p>
      <div class="login-err" id="loginErr"></div>
      <label>Username</label>
      <input type="text" id="loginUser" placeholder="Username" />
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Password" />
      <button type="button" id="loginBtn">Login</button>
    </div>
  </div>

  <div id="appScreen" class="wrap hidden">
    <header>
      <div class="logo">
        <div class="logo-icon">SB</div>
        <div>
          <h1>Sajjad Baloch Finder</h1>
          <span>Pak SIM • CNIC • Vehicle</span>
        </div>
      </div>
      <div class="header-right">
        <span class="user-chip" id="currentUserLabel"></span>
        <button class="btn-sm btn-danger" id="logoutBtn" type="button">Logout</button>
      </div>
    </header>

    <div id="searchView">
      <h2>Ultimate Number Finder</h2>
      <p class="sub">Phone / CNIC / Vehicle Number se talash karein</p>
      <div class="card">
        <div class="row">
          <input class="field" id="q" type="text" placeholder="0300xxx | 35202xxx | SLK-0004" />
          <button class="btn-go" id="goBtn" type="button">Search</button>
        </div>
      </div>
      <div id="out"></div>
    </div>

    <footer>Developed by <b>Sajjad Baloch</b></footer>
  </div>

<script>
(function(){
  /* =====================================================
     LOGIN CREDENTIALS — yahan se change karein
     ===================================================== */

  // Admin
  var ADMIN_USER = "admin";
  var ADMIN_PASS = "admin@123";

  // Users — naya user add karne ke liye nayi line likhein
  var USERS = [
    { username: "user1", password: "pass1" },
    { username: "user2", password: "pass2" },
    { username: "ali",   password: "ali123" }
  ];

  /* ===================================================== */

  var API = "https://identra.janialexa610.workers.dev";
  var KEY = "identra-client-key-2026";
  var IDLE_MS = 30 * 60 * 1000;
  var idleTimer = null;
  var lastActivity = Date.now();

  function getSession(){
    try { return JSON.parse(localStorage.getItem("sb_session") || "null"); }
    catch(e){ return null; }
  }
  function setSession(obj){
    if (obj) localStorage.setItem("sb_session", JSON.stringify(obj));
    else localStorage.removeItem("sb_session");
  }

  function touchActivity(){
    lastActivity = Date.now();
    var s = getSession();
    if (s) {
      s.lastActivity = lastActivity;
      setSession(s);
    }
  }
  function startIdleWatch(){
    stopIdleWatch();
    lastActivity = Date.now();
    idleTimer = setInterval(function(){
      if (!getSession()) return;
      if (Date.now() - lastActivity >= IDLE_MS) {
        stopIdleWatch();
        setSession(null);
        showLogin();
        showErr("30 minute inactive — auto logout. Dobara login karein.");
      }
    }, 15000);
  }
  function stopIdleWatch(){
    if (idleTimer) { clearInterval(idleTimer); idleTimer = null; }
  }

  function showErr(msg){
    var el = document.getElementById("loginErr");
    el.textContent = msg;
    el.style.display = "block";
  }

  function showLogin(){
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("appScreen").classList.add("hidden");
    document.getElementById("loginErr").style.display = "none";
    document.getElementById("loginUser").value = "";
    document.getElementById("loginPass").value = "";
  }

  function showApp(session){
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("appScreen").classList.remove("hidden");
    document.getElementById("currentUserLabel").textContent =
      session.isAdmin ? ("Admin: " + session.username) : ("User: " + session.username);
    touchActivity();
    startIdleWatch();
  }

  function doLogin(){
    var u = (document.getElementById("loginUser").value || "").trim();
    var p = document.getElementById("loginPass").value || "";
    if (!u || !p) { showErr("Username aur Password likhein"); return; }

    if (u === ADMIN_USER && p === ADMIN_PASS) {
      setSession({ username: u, isAdmin: true, lastActivity: Date.now() });
      showApp(getSession());
      return;
    }

    for (var i = 0; i < USERS.length; i++) {
      if (USERS[i].username === u && USERS[i].password === p) {
        setSession({ username: u, isAdmin: false, lastActivity: Date.now() });
        showApp(getSession());
        return;
      }
    }
    showErr("Galat username ya password");
  }

  function doLogout(){
    stopIdleWatch();
    setSession(null);
    showLogin();
  }

  function salt(){
    var a = new Uint8Array(16); crypto.getRandomValues(a);
    var s = ""; for (var i = 0; i < a.length; i++) s += a[i].toString(16).padStart(2, "0");
    return s + Date.now();
  }
  function clean(s){ return (s || "").trim().replace(/\s+/g, ""); }
  function esc(s){
    return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function val(v){
    if (v === null || v === undefined || v === "") return "—";
    return esc(String(v));
  }

  function doSearch(raw){
    var q = clean(raw), outEl = document.getElementById("out");
    if (!q) { outEl.innerHTML = '<div class="err">Number likhein</div>'; return; }
    outEl.innerHTML = '<div class="loading">Searching...</div>';
    document.getElementById("goBtn").disabled = true;
    fetch(API + "/api/lookup?q=" + encodeURIComponent(q), {
      method: "GET",
      headers: { "Accept": "application/json", "x-api-key": KEY, "x-device-salt": salt() }
    })
    .then(function(res){ return res.json(); })
    .then(function(data){
      if (data.error) { outEl.innerHTML = '<div class="err">' + esc(data.error) + '</div>'; return; }
      var html = "";
      if (data.citizen && data.citizen.success) html += renderCitizen(data);
      if (data.vehicles && data.vehicles.length) {
        for (var i = 0; i < data.vehicles.length; i++) html += renderVehicle(data.vehicles[i], i);
      } else if (data.vehicleNotes && data.vehicleNotes.length) {
        html += '<div class="result"><div class="result-top"><h3>Vehicle Notes</h3></div><div class="result-body" style="font-size:.88rem;color:#8b9bb8">';
        for (var n = 0; n < data.vehicleNotes.length; n++) html += "<div>• " + esc(data.vehicleNotes[n]) + "</div>";
        html += '</div></div>';
      }
      if (!html) html = '<div class="err">Koi record nahi mila</div>';
      outEl.innerHTML = html;
    })
    .catch(function(e){ outEl.innerHTML = '<div class="err">Error: ' + esc(e.message) + '</div>'; })
    .finally(function(){ document.getElementById("goBtn").disabled = false; });
  }

  function renderCitizen(data){
    var c = data.citizen, numbers = c.numbers || [], sims = c.simRecords || [];
    var html = '<div class="result"><div class="result-top"><h3>' + esc(c.name || "Unknown") + '</h3></div><div class="result-body"><div class="grid">';
    html += '<div class="item"><label>CNIC</label><div class="v">' + val(c.cnic) + '</div></div>';
    html += '<div class="item"><label>Address</label><div class="v">' + val(c.address) + '</div></div>';
    html += '<div class="item"><label>Numbers</label><div class="v">' + numbers.length + '</div></div></div>';
    if (numbers.length) {
      html += '<div class="sec">Registered Numbers</div><div class="chips">';
      for (var i = 0; i < numbers.length; i++) html += '<span class="chip">' + esc(numbers[i]) + '</span>';
      html += '</div>';
    }
    if (sims.length) {
      html += '<div class="sec">SIM Details</div><div style="overflow-x:auto"><table><thead><tr><th>Mobile</th><th>Name</th><th>CNIC</th><th>Address</th></tr></thead><tbody>';
      for (var j = 0; j < sims.length; j++) {
        var s = sims[j];
        html += '<tr><td>' + val(s.mobile) + '</td><td>' + val(s.name) + '</td><td>' + val(s.cnic) + '</td><td>' + val(s.address) + '</td></tr>';
      }
      html += '</tbody></table></div>';
    }
    return html + '</div></div>';
  }

  function renderVehicle(v, index){
    var fields = [
      ["Registration No", v.registrationNumber], ["Owner Name", v.ownerName],
      ["Father Name", v.ownerFathersName], ["Owner CNIC", v.ownerCNIC],
      ["Owner Address", v.ownerAddress], ["Owner Type", v.ownerType],
      ["Manufacturer", v.manufacturerName], ["Model", v.modelName],
      ["Model Year", v.modelYear || v.manufacturingYear], ["Vehicle Type", v.vehicleType],
      ["Category", v.vehicleCategoryName || v._CATEGORY_], ["Color", v.color],
      ["Engine No", v.engineNumber], ["Chassis No", v.chassisNumber],
      ["Engine Capacity", v.engineCapacity ? v.engineCapacity + " CC" : null],
      ["Fuel Type", v.fuelType], ["Seats", v.numberOfSeats], ["Tyres", v.numberofTyres],
      ["Province", v.provinceName], ["District", v.districtName],
      ["Division", v.divisionName], ["Branch", v.branchName],
      ["CPLC Status", v.cplcStatus], ["Last Tax Paid", v.lastTaxPaid],
      ["Reg. Updated", v.vehicleRegistrationUpdatedDate], ["Status", v.statusDescription]
    ];
    var items = "";
    for (var i = 0; i < fields.length; i++) {
      var label = fields[i][0], value = fields[i][1];
      if (value !== null && value !== undefined && value !== "")
        items += '<div class="item"><label>' + esc(label) + '</label><div class="v">' + esc(String(value)) + '</div></div>';
    }
    return '<div class="result"><div class="result-top"><h3>Vehicle ' + esc(v.registrationNumber || ("#" + (index+1))) +
      '</h3></div><div class="result-body"><div class="grid">' + items + '</div></div></div>';
  }

  document.getElementById("loginBtn").onclick = doLogin;
  document.getElementById("loginPass").onkeydown = function(e){ if (e.key === "Enter") doLogin(); };
  document.getElementById("loginUser").onkeydown = function(e){ if (e.key === "Enter") doLogin(); };
  document.getElementById("logoutBtn").onclick = doLogout;
  document.getElementById("goBtn").onclick = function(){ doSearch(document.getElementById("q").value); };
  document.getElementById("q").onkeydown = function(e){
    if (e.key === "Enter") doSearch(document.getElementById("q").value);
  };

  ["click", "keydown", "touchstart", "mousemove", "scroll"].forEach(function(ev){
    document.addEventListener(ev, touchActivity, { passive: true });
  });

  var session = getSession();
  if (session) {
    if (session.lastActivity && (Date.now() - session.lastActivity >= IDLE_MS)) {
      setSession(null);
      showLogin();
      showErr("Session expire — dobara login karein.");
    } else {
      showApp(session);
    }
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
