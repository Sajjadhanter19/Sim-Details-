<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sajjad Baloch | SIM & CNIC Lookup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0b1120, #1a2332, #0f172a);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 22px;
      padding: 36px 30px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.55);
    }

    .box.wide { max-width: 560px; }

    .brand {
      text-align: center;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #38bdf8, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 6px;
      color: #f1f5f9;
    }

    .sub {
      text-align: center;
      font-size: 0.82rem;
      color: #64748b;
      margin-bottom: 26px;
    }

    .group { margin-bottom: 16px; }

    .group label {
      display: block;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      font-size: 1rem;
      outline: none;
    }

    input:focus { border-color: #38bdf8; }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .row input { flex: 1; }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover { opacity: 0.92; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-sm {
      width: auto;
      padding: 14px 18px;
      font-size: 0.9rem;
    }

    .err {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: none;
    }

    .err.show { display: block; }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .logout {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      width: auto;
      padding: 8px 14px;
      font-size: 0.8rem;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.8rem;
      color: #64748b;
      border-top: 1px solid #1e293b;
      padding-top: 16px;
    }

    .footer b {
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ===== CLEAN RECORD CARDS ===== */
    .record {
      background: #1e293b;
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }

    .record-title {
      font-size: 0.8rem;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 14px;
      letter-spacing: 0.3px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field:last-child { margin-bottom: 0; }

    .field-label {
      font-size: 0.72rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 3px;
    }

    .field-value {
      font-size: 1rem;
      color: #f8fafc;
      font-weight: 500;
      word-break: break-word;
      line-height: 1.4;
    }

    .ok {
      text-align: center;
      margin-bottom: 18px;
    }

    .ok span {
      display: inline-block;
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 999px;
    }

    .ok small {
      display: block;
      margin-top: 6px;
      font-size: 0.78rem;
      color: #94a3b8;
    }

    .loading {
      text-align: center;
      padding: 24px 0;
      color: #94a3b8;
      display: none;
    }
    .loading.show { display: block; }

    .spin {
      width: 32px; height: 32px;
      border: 3px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      margin: 0 auto 10px;
      animation: s 0.7s linear infinite;
    }
    @keyframes s { to { transform: rotate(360deg); } }

    .hide { display: none !important; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="box" id="loginBox">
    <div class="brand">Sajjad Baloch</div>
    <h1>Welcome Back</h1>
    <p class="sub">Login to access SIM & CNIC Lookup</p>

    <div class="err" id="errMsg">Username ya Password galat hai</div>

    <div class="group">
      <label>Username</label>
      <input type="text" id="user" placeholder="Username" autocomplete="off">
    </div>

    <div class="group">
      <label>Password</label>
      <input type="password" id="pass" placeholder="Password" autocomplete="off">
    </div>

    <button type="button" id="loginBtn">Login</button>

    <div class="footer">Developed by <b>Sajjad Baloch</b></div>
  </div>

  <!-- MAIN APP -->
  <div class="box wide hide" id="appBox">
    <div class="top">
      <div class="brand" style="margin:0;font-size:1rem;">Sajjad Baloch</div>
      <button type="button" class="logout" id="logoutBtn">Logout</button>
    </div>

    <h1>SIM & CNIC Lookup</h1>
    <p class="sub">Pakistan Mobile Number & CNIC Owner Details</p>

    <div class="row">
      <input type="text" id="num" placeholder="Mobile Number or CNIC">
      <button type="button" class="btn-sm" id="searchBtn">Search</button>
    </div>

    <div class="loading" id="load">
      <div class="spin"></div>
      <div>Searching...</div>
    </div>

    <div id="out"></div>

    <div class="footer">Developed by <b>Sajjad Baloch</b></div>
  </div>

  <script>
    // ========== CREDENTIALS ==========
    const USER = "admin";
    const PASS = "sajjad123";
    // =================================

    const loginBox = document.getElementById("loginBox");
    const appBox   = document.getElementById("appBox");
    const errMsg   = document.getElementById("errMsg");

    document.getElementById("loginBtn").onclick = function () {
      const u = document.getElementById("user").value.trim();
      const p = document.getElementById("pass").value.trim();

      if (u === USER && p === PASS) {
        errMsg.classList.remove("show");
        loginBox.classList.add("hide");
        appBox.classList.remove("hide");
        try { localStorage.setItem("sajjad_ok", "1"); } catch(e) {}
      } else {
        errMsg.classList.add("show");
      }
    };

    document.getElementById("logoutBtn").onclick = function () {
      appBox.classList.add("hide");
      loginBox.classList.remove("hide");
      document.getElementById("user").value = "";
      document.getElementById("pass").value = "";
      document.getElementById("out").innerHTML = "";
      errMsg.classList.remove("show");
      try { localStorage.removeItem("sajjad_ok"); } catch(e) {}
    };

    try {
      if (localStorage.getItem("sajjad_ok") === "1") {
        loginBox.classList.add("hide");
        appBox.classList.remove("hide");
      }
    } catch(e) {}

    document.getElementById("pass").onkeypress = function(e) {
      if (e.key === "Enter") document.getElementById("loginBtn").click();
    };
    document.getElementById("user").onkeypress = function(e) {
      if (e.key === "Enter") document.getElementById("pass").focus();
    };

    // ========== SEARCH ==========
    const PROXY = "https://corx.envx.cn/fetch?corx-key=corx_wurhkSx9Z5GkXBs85bu8iyqJ-963qATW&url=";
    const API   = "http://wasifali.biz.id/public_apis/sim-info-api.php?search=";

    document.getElementById("searchBtn").onclick = doSearch;
    document.getElementById("num").onkeypress = function(e) {
      if (e.key === "Enter") doSearch();
    };

    async function doSearch() {
      const number = document.getElementById("num").value.trim();
      const btn    = document.getElementById("searchBtn");
      const load   = document.getElementById("load");
      const out    = document.getElementById("out");

      if (!number || number.length < 10) {
        alert("Please enter valid Mobile Number or CNIC");
        return;
      }

      btn.disabled = true;
      load.classList.add("show");
      out.innerHTML = "";

      try {
        const url = PROXY + encodeURIComponent(API + encodeURIComponent(number));
        const res = await fetch(url);
        const data = await res.json();

        load.classList.remove("show");

        if (!data.success || data.error === "NO_RECORD_FOUND") {
          out.innerHTML = `<div class="err show">
            <strong>${data.error || "No Record"}</strong><br>
            ${data.message || "Data nahi mila"}
          </div>`;
          btn.disabled = false;
          return;
        }

        const records = data.records || [];
        if (!records.length) {
          out.innerHTML = `<div class="err show">Empty data</div>`;
          btn.disabled = false;
          return;
        }

        let html = `<div class="ok">
          <span>✓ Record Found</span>
          <small>${data.count || records.length} record(s) milay</small>
        </div>`;

        const order = ["name", "mobile", "cnic", "address", "network"];

        records.forEach((r, i) => {
          html += `<div class="record">
            <div class="record-title">Record #${i + 1}</div>`;

          // Preferred fields first
          order.forEach(k => {
            if (r[k] !== undefined && r[k] !== null && r[k] !== "") {
              html += `
                <div class="field">
                  <div class="field-label">${k}</div>
                  <div class="field-value">${escapeHtml(String(r[k]))}</div>
                </div>`;
            }
          });

          // Extra fields
          for (let k in r) {
            if (order.includes(k)) continue;
            if (r[k] === undefined || r[k] === null || r[k] === "") continue;
            html += `
              <div class="field">
                <div class="field-label">${k}</div>
                <div class="field-value">${escapeHtml(String(r[k]))}</div>
              </div>`;
          }

          html += `</div>`;
        });

        out.innerHTML = html;

      } catch (e) {
        load.classList.remove("show");
        out.innerHTML = `<div class="err show"><strong>Error</strong><br>${e.message}</div>`;
      }

      btn.disabled = false;
    }

    function escapeHtml(text) {
      const d = document.createElement("div");
      d.textContent = text;
      return d.innerHTML;
    }
  </script>
</body>
</html>
